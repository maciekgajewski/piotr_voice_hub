# The hub (T-012, design.md §9), its Piper TTS service (T-015) and its speaker recognition
# (T-018).
# Usage (on piotr, from the repo root; see the T-012 and T-018 PR checklists):
#   export HUB_CONFIG=~/hub-wake.yaml HUB_USER="$(id -u):$(id -g)"
#   mkdir -p ~/.cache/piotr_voice_hub/huggingface ~/speaker-profiles
#   docker compose up -d --build
# HUB_CONFIG holds the satellites' API keys: keep it mode 600. The container runs as HUB_USER,
# the config's owner, so it can read the file without loosening its permissions.
# An invalid config exits 2 and `restart: unless-stopped` then restarts it in a loop: check
# `docker compose logs hub` after any config change.
name: piotr-voice-hub

services:
  hub:
    build:
      context: .
      dockerfile: docker/hub.Dockerfile
    image: piotr-voice-hub:latest
    restart: unless-stopped
    init: true  # forwards SIGTERM; reaps; `docker compose stop` → clean shutdown, exit 0
    stop_grace_period: 30s  # shutdown is bounded: run() 10 s, sessions 3 s, API 5 s
    network_mode: host  # satellites on the LAN, .local names via zeroconf; API on api.port
    gpus: all
    # The hub checks Piper at startup (T-016). This orders `docker compose up` only: after a
    # reboot or a daemon restart Docker starts both at once, and the hub's check then waits for
    # Piper to listen (WARNING lines meanwhile): new attempts for 120 s, so about 137 s at most
    # with the last attempt's own bound, before it exits 1.
    depends_on:
      piper: {condition: service_healthy}
    user: "${HUB_USER:?set HUB_USER=$(id -u):$(id -g), the owner of HUB_CONFIG}"
    volumes:
      - type: bind
        source: "${HUB_CONFIG:?set HUB_CONFIG to the hub config path}"
        target: /config/hub.yaml
        read_only: true
        bind: {create_host_path: false}
      - type: bind  # the model cache; must exist (mkdir -p), else compose fails at once
        source: "${HUB_CACHE:-${HOME}/.cache/piotr_voice_hub/huggingface}"
        target: /hf
        bind: {create_host_path: false}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "5"}
    healthcheck:
      # Liveness (design.md §6): /healthz answers once the model is warm and the API is up.
      # Docker only marks the container unhealthy, it never restarts it: restarts come from
      # the process exiting (a session failure, or the event-loop watchdog, hub/watchdog.py).
      test: ["CMD", "piotr-voice-hub-healthcheck", "--config", "/config/hub.yaml"]
      start_period: 180s
      start_interval: 2s
      interval: 30s
      timeout: 5s
      retries: 3

  # T-015: the hub's own wyoming-piper on the GPU (docker/piper.Dockerfile), on port 10201
  # (`tts.uri`), next to the old project's Piper on 10200. It warms the voice up before it
  # listens, so healthy means warm. It listens on 127.0.0.1 only: the hub, also on the host
  # network, is its only client, and wyoming has no limit on a message's size. Start it alone
  # with `docker compose up -d --build piper` (compose still needs HUB_CONFIG and HUB_USER set
  # to read this file).
  piper:
    build:
      context: .
      dockerfile: docker/piper.Dockerfile
    image: piotr-voice-hub-piper:latest
    restart: unless-stopped
    init: true
    network_mode: host
    gpus: all
    command: ["--uri", "tcp://127.0.0.1:10201", "--voice", "pl_PL-bass-high",
              "--data-dir", "/opt/piper/voices"]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "5"}
    healthcheck:
      # A Describe/Info round trip (wyoming-piper's own check). Docker never restarts an
      # unhealthy container: restarts come from the process exiting on any failure, including
      # a synthesis that runs over 30 s or an onnxruntime run-time error (GuardedVoice).
      test: ["CMD", "python", "-m", "wyoming_piper.health_check",
             "--uri", "tcp://127.0.0.1:10201", "--timeout", "5"]
      start_period: 300s
      start_interval: 2s
      interval: 30s
      timeout: 10s
      retries: 3

  # T-018: the hub's speaker recognition (docker/speaker.Dockerfile), SpeechBrain ECAPA on the
  # CPU (no VRAM), on 127.0.0.1:2141 (`speaker_recognition.url`), next to the old project's on
  # 2140. Loopback only: the hub is its only client. The profiles (.npz, `profile_embedding`)
  # are read from SPEAKER_PROFILES, mounted at /profiles: the hub config's profile paths are
  # under /profiles. It runs as HUB_USER, who must be able to read them. A missing directory
  # is created empty (by Docker, owned by root; better `mkdir -p` it first) rather than failing
  # the whole project: with no profile there, every hint is null. No depends_on: the hint is
  # optional, the hub runs (speaker null, a WARNING per utterance) without the service.
  speaker-recognition:
    build:
      context: .
      dockerfile: docker/speaker.Dockerfile
    image: piotr-voice-hub-speaker:latest
    restart: unless-stopped
    init: true
    network_mode: host
    user: "${HUB_USER:?set HUB_USER=$(id -u):$(id -g), the owner of HUB_CONFIG}"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]  # it needs none: an unprivileged port, files readable by HUB_USER
    security_opt: ["no-new-privileges:true"]
    command: ["--host", "127.0.0.1", "--port", "2141", "--profiles-dir", "/profiles",
              "--threshold", "0.45"]
    volumes:
      - type: bind
        source: "${SPEAKER_PROFILES:-${HOME}/speaker-profiles}"
        target: /profiles
        read_only: true
        bind: {create_host_path: true}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "5"}
    healthcheck:
      # Healthy means warm: the port opens after the model loaded and embedded once. The
      # process exits on a startup failure; a request failure is a 4xx/5xx, logged.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:2141/health', timeout=5)"]
      start_period: 120s
      start_interval: 2s
      interval: 30s
      timeout: 10s
      retries: 3
