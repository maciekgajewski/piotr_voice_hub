[project]
name = "piotr-voice-hub"
version = "0.1.0"
description = "Voice I/O hub for ESPHome satellites: VAD, Polish STT, wake phrase, speaker hint, TTS."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
piotr-voice-hub = "piotr_voice_hub.cli:main"

[dependency-groups]
dev = [
    "pyright[nodejs]",
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
