[project]
name = "piotr-voice-hub"
version = "0.1.0"
description = "Voice I/O hub for ESPHome satellites: VAD, Polish STT, wake phrase, speaker hint, TTS."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aioesphomeapi==45.3.1",
    "av>=15,<16",
    "faster-whisper==1.2.1",
    "numpy>=2",
    "onnxruntime>=1.20",
    "pyyaml>=6.0.3",
    "websockets>=15,<16",
    "wyoming==1.10.2",
]

[project.scripts]
piotr-voice-hub = "piotr_voice_hub.cli:main"
piotr-voice-hub-healthcheck = "piotr_voice_hub.cli:healthcheck"
piotr-voice-hub-wake-test = "piotr_voice_hub.wake_test:main"

[dependency-groups]
dev = [
    "pyright[nodejs]",
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pyright]
include = ["src", "tests", "tools/speak_test.py"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["gpu: needs piotr's GPU (tools/stt-gpu-test.sh, tools/piper-gpu-test.sh)"]
